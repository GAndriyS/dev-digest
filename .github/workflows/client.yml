# Client suite — Next.js web app (@devdigest/web).
# Typecheck + component/unit tests (vitest + jsdom). Hermetic: no API, no DB,
# no browser — fetch is mocked in the tests. The full-stack browser flow lives
# in e2e-web.yml.
name: client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # UI-architecture boundaries (see .claude/skills/frontend-ui-architecture).
      # Two tools on purpose: dependency-cruiser enforces the module graph (who may
      # import whom), and check-ui-conventions.mjs the two syntax-level rules a
      # graph tool cannot see — `export *` in a barrel, and `fetch()` outside
      # lib/api.ts. Inlined rather than `pnpm arch` to match the other workflows,
      # which do not rely on committed package scripts.
      - name: Architecture boundaries
        run: |
          pnpm exec depcruise src --config .dependency-cruiser.cjs
          node scripts/check-ui-conventions.mjs

      - run: pnpm test
