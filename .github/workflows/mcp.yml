# mcp suite — the local stdio MCP server over the DevDigest API (@devdigest/mcp).
# Five tools (list_agents, run_agent_on_pr, get_findings, get_conventions,
# get_blast_radius) that talk plain HTTP to server/. Tests are hermetic units
# with the api-client substituted at the tool-factory seam. Uses npm
# (package-lock.json).
#
# server/src/vendor/shared/** is in the path filter because mcp/ aliases
# @devdigest/shared to it at type-check time (import type only).
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
